title: Secureframe Local Upload Helpers
description: Local evidence and questionnaire uploads alongside the official Secureframe MCP, using your existing OAuth sign-in.
url: https://misfitdev.github.io
baseurl: /better-secureframe-mcp-server
repository_url: https://github.com/misfitdev/better-secureframe-mcp-server
install_ref: codex/supplemental-local-uploads
# Custom layout (no theme). All pages default to the `default` layout.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - openapi.yaml

kramdown:
  input: GFM
