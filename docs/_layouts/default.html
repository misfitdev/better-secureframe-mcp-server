<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <main id="main">
      <header>
        <h1>{{ page.title }}</h1>
        <p class="intro">{{ page.dek }}</p>
      </header>
      {{ content }}
      <footer>
        <a href="{{ site.repository_url }}">Source</a>
        <a href="{{ site.repository_url }}/blob/{{ site.install_ref }}/LICENSE">MIT license</a>
      </footer>
    </main>
  </body>
</html>
