[project]
name = "better-secureframe-mcp-server"
version = "0.2.0"
description = "Local file upload helpers that supplement the official Secureframe MCP server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "misfitdev" }]
maintainers = [{ name = "misfitdev" }]
keywords = ["secureframe", "compliance", "mcp", "security", "automation"]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Office/Business",
]
dependencies = [
    "fastmcp~=4.1",
    "httpx~=0.28",
    "pydantic~=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "ruff~=0.17",
    "build~=1.6",
    "twine~=7.0",
]

[project.scripts]
better-secureframe-mcp = "better_secureframe_mcp.server:main"

[project.urls]
Homepage = "https://github.com/misfitdev/better-secureframe-mcp-server"
Repository = "https://github.com/misfitdev/better-secureframe-mcp-server.git"
Issues = "https://github.com/misfitdev/better-secureframe-mcp-server/issues"
Documentation = "https://github.com/misfitdev/better-secureframe-mcp-server#readme"

[build-system]
requires = ["setuptools>=84.2", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["better_secureframe_mcp*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
